name: rag-pitfalls-demo

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8081:8081"
    environment:
      # Required — set in demo/.env (gitignored). To compute the hash:
      #   docker run --rm caddy:2.8-alpine caddy hash-password --plaintext '<new>'
      # then put the result into demo/.env as BASIC_AUTH_HASH=<paste>.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?must be set in demo/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?must be set in demo/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - qdrant
      - neo4j
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      POSTGRES_DSN: postgresql://demo:demo@postgres:5432/demo
      REDIS_URL: redis://redis:6379/0
      EMBEDDER_URL: http://embedder:80
      CORS_ORIGINS: "*"
    volumes:
      # SA key — host path mounted read-only; user mounts their own.
      - ./.secrets:/app/.secrets:ro
      # Live-editable rag.py — mounted as a named volume so apply_fix
      # survives across container restarts. The container always has
      # rag.py.default baked in, so a fresh volume bootstraps cleanly.
      - rag_state:/app/app/core/live
    expose:
      - "8000"
    depends_on:
      - qdrant
      - neo4j
      - postgres
      - redis
      - embedder
    restart: unless-stopped

  embedder:
    # cpu-1.7 ships hf-hub ≥ 0.4 (handles HF's new relative-redirect API).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    # BGE-M3's ONNX FP16 weights have caused silent warmup crashes on
    # CPU inference. We use bge-base-en-v1.5 instead — same author (BAAI),
    # smaller (110M params, ~400MB RAM vs ~3GB), and proven stable on TEI.
    # The downside: English-tuned. For 繁中 / 中文 queries we rely on
    # the cross-lingual nature of dense retrieval; if quality drops, the
    # fallback is to swap to `intfloat/multilingual-e5-base`.
    command: --model-id BAAI/bge-base-en-v1.5 --port 80 --dtype float32
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - embedder_cache:/data
    expose:
      - "80"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.0
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      # Required — set in demo/.env (gitignored).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?must be set in demo/.env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      # Bolt protocol (binary, can't be HTTP-proxied by Caddy) needs to be
      # reachable directly from the user's browser when Neo4j Browser
      # connects after login. Restrict via GCE firewall, not docker.
      - "7687:7687"
    expose:
      - "7474"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  pg_data:
  redis_data:
  embedder_cache:
  rag_state:
